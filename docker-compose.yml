services:
  postgres:
    image: postgres:17-alpine
    container_name: cryoflix-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: cryoflix
      POSTGRES_PASSWORD: cryoflix_dev
      POSTGRES_DB: cryoflix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryoflix -d cryoflix"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cryoflix-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
